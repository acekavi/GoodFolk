[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory (vulnerability, unmaintained, unsound, yanked).
version = 2
yanked = "deny"
# svc-auth verifies RS256 signatures with the rsa crate and never signs with it. The advisory is a timing attack on
# private-key operations and has no patched release.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# rav1e lists libfuzzer-sys under cfg(fuzzing) only; it is never built. NCSA is the permissive LLVM/Illinois licence.
exceptions = [{ allow = ["NCSA"], crate = "libfuzzer-sys" }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
