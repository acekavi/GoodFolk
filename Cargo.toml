[workspace]
resolver = "3"
members = ["crates/*", "modules/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
db = { path = "crates/db" }
domain = { path = "crates/domain" }
identity = { path = "modules/identity" }
property = { path = "modules/property" }
rates = { path = "modules/rates" }
reservations = { path = "modules/reservations" }
rooms = { path = "modules/rooms" }

anyhow = "1"
argon2 = "0.6"
async-graphql = { version = "7.2", default-features = false, features = ["uuid", "time"] }
async-graphql-axum = "7.2"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.23"
flate2 = "1"
futures = "0.3"
garde = { version = "0.23", features = ["derive", "email"] }
getrandom = "0.3"
http-body-util = "0.1"
mimalloc = "0.1"
proptest = "1"
# Already in the tree through rustls; keep the same version so no second copy is built.
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["macros", "serde", "serde-well-known", "serde-human-readable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "compression-br", "compression-zstd", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "6", features = ["uuid", "time"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
