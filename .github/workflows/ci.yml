name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: goodfolk_owner
          POSTGRES_PASSWORD: goodfolk_owner_dev
          POSTGRES_DB: goodfolk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goodfolk_owner"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # Tests create throwaway databases, so they connect as the owner (superuser).
      DATABASE_URL: postgres://goodfolk_owner:goodfolk_owner_dev@localhost:5432/goodfolk
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Create database roles
        run: psql "$DATABASE_URL" -f deploy/dev/postgres-init.sql
      # nasm: rav1e's assembly. lzip: libjxl.sh unpacks libjxl's release archive.
      - name: Install build tools for the imaging crate
        run: sudo apt-get update && sudo apt-get install -y nasm lzip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/goodfolk-libjxl
          key: libjxl-${{ hashFiles('deploy/dev/libjxl.sh') }}
      # cjxl and djxl land in ~/.cache/goodfolk-libjxl/bin, where the imaging crate looks by default.
      - name: Install libjxl's command line tools
        run: sh deploy/dev/libjxl.sh install
      - uses: actions/cache@v4
        with:
          path: ~/.cache/goodfolk-rustfs/rustfs
          key: rustfs-${{ hashFiles('deploy/dev/rustfs.sh') }}
      # The storage tests need an S3 server on :9000.
      - name: Start RustFS and create the development buckets
        run: |
          sh deploy/dev/rustfs.sh install && sh deploy/dev/rustfs.sh start
          cargo run -p storage --example ensure-buckets
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The exact SSIMULACRA2 checks need optimised code: minutes in a debug build.
      - name: Image quality gate and metric equivalence, in release
        run: cargo test -p imaging --release --lib --test quality_gate
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/pms
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Generated API types match the backend
        run: |
          bun run api:schemas
          bun run codegen
          git diff --exit-code -- src/lib/api
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: goodfolk_owner
          POSTGRES_PASSWORD: goodfolk_owner_dev
          POSTGRES_DB: goodfolk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goodfolk_owner"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_OWNER_URL: postgres://goodfolk_owner:goodfolk_owner_dev@localhost:5432/goodfolk
      # Playwright starts the API as the API role against this database.
      E2E_DATABASE_URL: postgres://goodfolk_api:goodfolk_api_dev@localhost:5432/goodfolk
      # Tests seed and check what the API cannot as the schema owner.
      E2E_OWNER_URL: postgres://goodfolk_owner:goodfolk_owner_dev@localhost:5432/goodfolk
    defaults:
      run:
        working-directory: web/pms
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Create database roles and apply migrations
        run: |
          psql "$DATABASE_OWNER_URL" -f ../../deploy/dev/postgres-init.sql
          cargo run -q -p core-api -- migrate
      # nasm: rav1e's assembly. lzip: libjxl.sh unpacks libjxl's release archive.
      - name: Install build tools for the imaging crate
        run: sudo apt-get update && sudo apt-get install -y nasm lzip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/goodfolk-libjxl
          key: libjxl-${{ hashFiles('deploy/dev/libjxl.sh') }}
      # cjxl and djxl land in ~/.cache/goodfolk-libjxl/bin, where media-svc's workers look by default.
      - name: Install libjxl's command line tools
        run: sh ../../deploy/dev/libjxl.sh install
      - uses: actions/cache@v4
        with:
          path: ~/.cache/goodfolk-rustfs/rustfs
          key: rustfs-${{ hashFiles('deploy/dev/rustfs.sh') }}
      # The media tests upload to an S3 server on :9000, which Playwright cannot start.
      - name: Start RustFS and create the development buckets
        run: |
          sh ../../deploy/dev/rustfs.sh install && sh ../../deploy/dev/rustfs.sh start
          cargo run -p storage --example ensure-buckets
      - name: Build the API and media-svc that Playwright starts
        run: cargo build -p core-api -p media-svc
      - run: bun install --frozen-lockfile
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs; allow them so the
      # sandbox stays on.
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/pms/test-results
