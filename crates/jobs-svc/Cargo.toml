[package]
name = "jobs-svc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
audit.workspace = true
# gRPC (HTTP/2, cleartext) and `POST /tick` (HTTP/1.1) share one port.
axum = { workspace = true, features = ["http2"] }
db.workspace = true
fx.workspace = true
proto.workspace = true
serde_json.workspace = true
sqlx.workspace = true
storage.workspace = true
svc-auth.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net"] }
# TaskTracker, for the closes running in the background.
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true, features = ["router"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
db = { workspace = true, features = ["testing"] }
folio.workspace = true
property.workspace = true
reqwest.workspace = true
rooms.workspace = true
rust_decimal.workspace = true
# SIGKILL for the crash test.
rustix = { version = "1", features = ["process"] }
tokio = { workspace = true, features = ["net", "process"] }

[lints]
workspace = true
