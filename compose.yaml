# Local development services. Production uses Neon and Cloudflare R2 (see docs/ARCHITECTURE.md §3.4).
services:
  postgres:
    image: postgres:17
    environment:
      # Superuser for migrations and for tests (which create throwaway databases).
      POSTGRES_USER: goodfolk_owner
      POSTGRES_PASSWORD: goodfolk_owner_dev
      POSTGRES_DB: goodfolk
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/dev/postgres-init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "goodfolk_owner"]
      interval: 2s
      retries: 30

  # S3-compatible storage for the media engine (what deploy/dev/rustfs.sh runs without Docker). Create the buckets with
  # `cargo run -p storage --example ensure-buckets`.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: goodfolk
      RUSTFS_SECRET_KEY: goodfolk_dev_secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

volumes:
  postgres-data:
  rustfs-data:
