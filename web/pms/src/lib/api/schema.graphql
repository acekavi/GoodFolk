type BedNode {
	kind: String!
	count: Int!
}

enum BlockKind {
	"""
	Out of inventory: reduces availability.
	"""
	OUT_OF_ORDER
	"""
	Still sellable; shown only.
	"""
	OUT_OF_SERVICE
}

"""
A room blocked for `[from, to)`: `to` is the first day it is back.
"""
type BlockNode {
	id: UUID!
	roomId: UUID!
	from: Date!
	to: Date!
	kind: BlockKind!
	reasonId: UUID!
	note: String!
	version: Int!
}

type BlockReasonNode {
	id: UUID!
	code: String!
	label: String!
	defaultKind: BlockKind!
	active: Boolean!
	version: Int!
}

type BulkPreviewNode {
	"""
	How many of the plan's prices would change.
	"""
	total: Int!
	"""
	The first 50, by date, room type and occupancy.
	"""
	cells: [PriceChangeCellNode!]!
}

type CancellationPolicyNode {
	id: UUID!
	name: String!
	"""
	Furthest from arrival first.
	"""
	rules: [CancellationRuleNode!]!
	noShow: PenaltyNode!
	version: Int!
}

type CancellationRuleNode {
	daysBeforeArrival: Int!
	penalty: PenaltyNode!
}

enum ChangeMode {
	PERCENT
	AMOUNT
}

"""
ISO 8601 calendar date without timezone.
Format: %Y-%m-%d

# Examples

* `1994-11-13`
* `2000-02-24`
"""
scalar Date

"""
One room type on one day. `available = physical - sold - outOfOrder`.
"""
type InventoryDayNode {
	date: Date!
	roomTypeId: UUID!
	physical: Int!
	sold: Int!
	outOfOrder: Int!
	available: Int!
}

enum MealPlan {
	RO
	BB
	HB
	FB
}

"""
Per person per night on top of the room price, for the nights from `from` until `to` (`null`: open-ended).
"""
type MealSupplementNode {
	id: UUID!
	mealPlan: MealPlan!
	currency: String!
	adultAmount: Int!
	childAmount: Int!
	from: Date!
	to: Date
	version: Int!
}

enum PenaltyKind {
	NIGHTS
	PERCENT
	AMOUNT
}

type PenaltyNode {
	kind: PenaltyKind!
	value: Int!
}

enum PlanKind {
	STANDARD
	DERIVED
	CUSTOM
}

"""
One price a bulk change would change: `before` is `null` where `SET` adds a price.
"""
type PriceChangeCellNode {
	roomTypeId: UUID!
	date: Date!
	occupancy: Int!
	before: Int
	after: Int!
}

enum PriceChangeMode {
	PERCENT
	AMOUNT
	SET
}

type PropertyNode {
	id: UUID!
	code: String!
	name: String!
	timezone: String!
	baseCurrency: String!
	"""
	`HH:MM`, local time.
	"""
	checkInTime: String!
	"""
	`HH:MM`, local time.
	"""
	checkOutTime: String!
	businessDate: Date!
	"""
	Send as `If-Match: "<version>"` when updating.
	"""
	version: Int!
}

type Query {
	"""
	Properties the current user can see, ordered by code.
	"""
	properties: [PropertyNode!]!
	"""
	The property's room types, active or not, in display order.
	"""
	roomTypes(propertyId: UUID!): [RoomTypeNode!]!
	"""
	The property's rooms, active or not, in display order; only one type's if `roomTypeId` is given.
	"""
	rooms(propertyId: UUID!, roomTypeId: UUID): [RoomNode!]!
	"""
	Housekeeping sections, by name.
	"""
	sections(propertyId: UUID!): [SectionNode!]!
	"""
	Reasons a room can be blocked for, active or not, by code.
	"""
	blockReasons(propertyId: UUID!): [BlockReasonNode!]!
	"""
	Active room blocks overlapping `[from, to)` (at most 400 days), by start date.
	"""
	blocks(propertyId: UUID!, from: Date!, to: Date!): [BlockNode!]!
	"""
	Counts per room type per day for `[from, to)` (at most 93 days), by date then room type. Days before
	the business date that were never counted, and days past the 730-day window, have no rows.
	"""
	inventory(propertyId: UUID!, from: Date!, to: Date!): [InventoryDayNode!]!
	"""
	The property's rate plans in tree order: each standard or custom plan, by code, followed by the plans
	derived from it, depth first.
	"""
	ratePlans(propertyId: UUID!): [RatePlanNode!]!
	"""
	A plan's prices and restrictions for `[from, to)` (at most 93 days), by date, room type and occupancy.
	"""
	rateGrid(propertyId: UUID!, ratePlanId: UUID!, from: Date!, to: Date!): RateGridNode!
	"""
	What a bulk change would do to a standard or custom plan's prices on `[from, to)`, without doing it.
	Left out, `weekdays` (ISO: 1 = Monday), `roomTypeIds` and `occupancies` mean all.
	"""
	bulkChangePreview(propertyId: UUID!, ratePlanId: UUID!, from: Date!, to: Date!, weekdays: [Int!]! = [], roomTypeIds: [UUID!]! = [], occupancies: [Int!]! = [], mode: PriceChangeMode!, value: Int!): BulkPreviewNode!
	"""
	Meal supplements by currency, meal plan and start.
	"""
	mealSupplements(propertyId: UUID!): [MealSupplementNode!]!
	"""
	Cancellation policies by name.
	"""
	cancellationPolicies(propertyId: UUID!): [CancellationPolicyNode!]!
	"""
	Prices a stay of `[checkIn, checkOut)` (at most 90 nights) and lists every reason it cannot be sold.
	"""
	quote(propertyId: UUID!, roomTypeId: UUID!, ratePlanId: UUID!, mealPlan: MealPlan!, checkIn: Date!, checkOut: Date!, adults: Int!, children: Int!, residency: Residency!): QuoteNode!
}

type QuoteNightNode {
	date: Date!
	room: Int!
	meal: Int!
}

"""
What a stay costs, in minor units of `currency`. `restrictionsOk` is true when nothing stops the sale.
"""
type QuoteNode {
	nights: [QuoteNightNode!]!
	total: Int!
	currency: String!
	restrictionsOk: Boolean!
	violations: [ViolationNode!]!
}

"""
A plan's resolved prices and restrictions for a date range. Days without a row have none.
"""
type RateGridNode {
	prices: [RatePriceNode!]!
	restrictions: [RestrictionNode!]!
}

"""
A rate plan. Amounts are minor units in its currency.
"""
type RatePlanNode {
	id: UUID!
	code: String!
	name: String!
	kind: PlanKind!
	segment: Segment!
	"""
	`null`: any guest.
	"""
	residency: Residency
	currency: String!
	parentId: UUID
	"""
	Levels of plans above this one; the list is in tree order, so this indents it.
	"""
	depth: Int!
	deriveMode: ChangeMode
	deriveValue: Int
	roundingStep: Int!
	extraAdultAmount: Int!
	inheritRestrictions: Boolean!
	allowedMealPlans: [MealPlan!]!
	cancellationPolicyId: UUID
	roomTypeIds: [UUID!]!
	active: Boolean!
	version: Int!
}

"""
A price for `occupancy` adults, in minor units of the plan's currency.
"""
type RatePriceNode {
	roomTypeId: UUID!
	date: Date!
	occupancy: Int!
	amount: Int!
}

enum Residency {
	RESIDENT
	NON_RESIDENT
}

type RestrictionNode {
	roomTypeId: UUID!
	date: Date!
	closed: Boolean!
	minStay: Int
	maxStay: Int
	closedToArrival: Boolean!
	closedToDeparture: Boolean!
}

type RoomNode {
	id: UUID!
	roomTypeId: UUID!
	number: String!
	floor: String
	sectionId: UUID
	active: Boolean!
	sortOrder: Int!
	version: Int!
}

type RoomTypeNode {
	id: UUID!
	code: String!
	name: String!
	baseOccupancy: Int!
	maxAdults: Int!
	maxChildren: Int!
	maxOccupancy: Int!
	beds: [BedNode!]!
	amenities: [String!]!
	sortOrder: Int!
	active: Boolean!
	version: Int!
}

type SectionNode {
	id: UUID!
	name: String!
	version: Int!
}

enum Segment {
	FIT_F
	FIT_L
	OTA
	TA
	IBE
}

"""
A UUID is a unique 128-bit number, stored as 16 octets. UUIDs are parsed as
Strings within GraphQL. UUIDs are used to assign unique identifiers to
entities without requiring a central allocating authority.

# References

* [Wikipedia: Universally Unique Identifier](http://en.wikipedia.org/wiki/Universally_unique_identifier)
* [RFC4122: A Universally Unique Identifier (UUID) URN Namespace](http://tools.ietf.org/html/rfc4122)
"""
scalar UUID

enum ViolationKind {
	INVALID_STAY
	INACTIVE
	RESIDENCY
	ROOM_TYPE_NOT_SOLD
	OCCUPANCY
	MEAL_PLAN_NOT_ALLOWED
	NO_PRICE
	NO_MEAL_SUPPLEMENT
	CLOSED
	MIN_STAY
	MAX_STAY
	CLOSED_TO_ARRIVAL
	CLOSED_TO_DEPARTURE
}

type ViolationNode {
	kind: ViolationKind!
	date: Date
	message: String!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: Query
